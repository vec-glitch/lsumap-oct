<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LSU 2D Campus Navigation (Vector Map)</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f5f2;color:#222}
.app{max-width:1450px;margin:auto;padding:18px}
h1{margin:0 0 5px;font-size:25px}
.sub{margin:0 0 15px;color:#666;font-size:14px}
.controls{display:flex;gap:10px;align-items:end;flex-wrap:wrap;background:#fff;padding:14px;border-radius:12px;box-shadow:0 2px 10px #0001;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:5px}
label{font-size:12px;font-weight:bold;color:#555}
select,button{height:40px;border:1px solid #ccc;border-radius:8px;padding:0 12px;background:white;font-size:14px}
select{min-width:210px}
button{cursor:pointer;font-weight:bold}
.find{background:#176b36;color:#fff;border-color:#176b36}
.clear{background:#eee}
.status{margin-left:auto;font-size:13px;color:#555;max-width:360px}
.map-wrap{background:#fff;border-radius:12px;box-shadow:0 2px 10px #0001;overflow:hidden;position:relative}
.map-stage{position:relative;width:100%;line-height:0;overflow:auto;background:#e8ead3; /* Green background */}
#map{display:block;width:100%;height:auto;min-width:850px}
#overlay{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.route{fill:none;stroke:#0b74ff;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 2px #0006)}
.route-inner{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.marker{pointer-events:auto;cursor:pointer}
.marker circle{fill:#111;stroke:#fff;stroke-width:2}
.marker text{fill:#fff;font-weight:bold;font-size:14px;text-anchor:middle;dominant-baseline:middle}
.marker.selected circle{fill:#0b74ff}
.marker.start circle{fill:#16823c}
.marker.end circle{fill:#d33}
.legend{padding:10px 14px;font-size:12px;color:#666;background:#fff}
.legend span{display:inline-block;margin-right:18px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:-1px;background:#111}
.dot.blue{background:#0b74ff}.dot.green{background:#16823c}.dot.red{background:#d33}
.info{position:absolute;right:14px;top:14px;background:#fff;border-radius:10px;padding:12px 14px;box-shadow:0 3px 14px #0003;font-size:13px;line-height:1.45;max-width:260px;display:none}
.info strong{font-size:15px}
@media(max-width:700px){.app{padding:10px}.status{margin-left:0;width:100%}select{min-width:170px}.controls{align-items:stretch}}
</style>
</head>
<body>
<div class="app">
  <h1>LSU 2D Campus Navigation</h1>
  <p class="sub">Click a building on the map to set it as the start. Select a destination and click Find Route.</p>

  <div class="controls">
    <div class="field">
      <label for="start">START BUILDING</label>
      <select id="start"></select>
    </div>
    <div class="field">
      <label for="end">DESTINATION</label>
      <select id="end"></select>
    </div>
    <button class="find" id="find">Find Route</button>
    <button class="clear" id="clear">Clear Route</button>
    <div class="status" id="status">Choose a start and destination.</div>
  </div>

  <div class="map-wrap">
    <div class="map-stage" id="stage">
      <!-- The SVG is now the main map, not just an overlay -->
      <svg id="map" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet">
        <!-- Background -->
        <rect width="1600" height="900" fill="#dce3c7" />
        
        <!-- Draw the walkable paths (white roads) -->
        <g id="roadLayer" stroke="#ffffff" stroke-width="20" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <!-- We will populate this with JS to match the nodes -->
        </g>

        <!-- Draw the buildings -->
        <g id="buildingLayer">
            <!-- We will populate this with JS -->
        </g>

        <!-- The route line goes on top -->
        <g id="routeLayer" style="pointer-events:none;"></g>
        <!-- Markers go on top -->
        <g id="markerLayer" style="pointer-events:auto;"></g>
      </svg>
      <div class="info" id="info"></div>
    </div>
    <div class="legend">
      <span><i class="dot"></i>Building</span>
      <span><i class="dot green"></i>Start</span>
      <span><i class="dot red"></i>Destination</span>
      <span><i class="dot blue"></i>Walking route</span>
    </div>
  </div>
</div>

<script>
// 1. DEFINE BUILDINGS
// We define them as rectangles: [x, y, width, height, name]
// I have laid them out to roughly match your original image's layout.
const buildingData = {
  1: {x: 520, y: 350, w: 100, h: 80, name: "Science Hall"},
  2: {x: 750, y: 320, w: 120, h: 70, name: "Library"},
  3: {x: 580, y: 780, w: 100, h: 80, name: "Arts Center"},
  4: {x: 630, y: 220, w: 110, h: 60, name: "Admin Building"},
  5: {x: 500, y: 250, w: 80, h: 70, name: "Student Union"},
  6: {x: 420, y: 230, w: 60, h: 50, name: "Gym"},
  7: {x: 520, y: 180, w: 70, h: 60, name: "Music Hall"},
  8: {x: 400, y: 180, w: 60, h: 50, name: "Theater"},
  9: {x: 480, y: 120, w: 80, h: 60, name: "Physics Lab"},
  10: {x: 440, y: 60, w: 70, h: 50, name: "Chemistry Lab"},
  11: {x: 530, y: 60, w: 80, h: 50, name: "Biology Lab"},
  12: {x: 620, y: 60, w: 80, h: 50, name: "Computer Science"},
  13: {x: 730, y: 160, w: 100, h: 70, name: "Engineering"},
  14: {x: 850, y: 70, w: 70, h: 50, name: "Math Dept"},
  15: {x: 920, y: 40, w: 60, h: 40, name: "Observatory"},
  16: {x: 990, y: 40, w: 60, h: 40, name: "Planetarium"},
  17: {x: 960, y: 10, w: 50, h: 30, name: "Radio Station"},
  18: {x: 960, y: 130, w: 60, h: 50, name: "Language Center"},
  19: {x: 950, y: 200, w: 80, h: 70, name: "Law School"},
  20: {x: 980, y: 380, w: 60, h: 50, name: "Business School"},
  21: {x: 610, y: 750, w: 70, h: 50, name: "Dorm A"},
  22: {x: 760, y: 650, w: 80, h: 60, name: "Dorm B"},
  23: {x: 740, y: 730, w: 70, h: 50, name: "Dorm C"},
  24: {x: 670, y: 730, w: 70, h: 50, name: "Dorm D"},
  25: {x: 400, y: 650, w: 80, h: 60, name: "Cafeteria"},
  26: {x: 500, y: 740, w: 70, h: 50, name: "Bookstore"},
  27: {x: 840, y: 740, w: 70, h: 50, name: "Health Center"},
  28: {x: 830, y: 520, w: 90, h: 70, name: "Main Auditorium"},
  29: {x: 790, y: 330, w: 60, h: 50, name: "Career Center"},
  30: {x: 850, y: 320, w: 60, h: 50, name: "Financial Aid"},
  31: {x: 1000, y: 610, w: 60, h: 50, name: "Security"},
  32: {x: 950, y: 700, w: 60, h: 50, name: "Parking Office"},
  33: {x: 310, y: 820, w: 80, h: 50, name: "Maintenance"},
  34: {x: 280, y: 570, w: 90, h: 60, name: "Faculty Offices"},
  35: {x: 200, y: 440, w: 60, h: 50, name: "Alumni House"},
  36: {x: 200, y: 340, w: 60, h: 50, name: "Visitor Center"},
  37: {x: 330, y: 340, w: 80, h: 60, name: "Sports Complex"},
  38: {x: 280, y: 740, w: 70, h: 50, name: "Pool"},
  39: {x: 1180, y: 440, w: 80, h: 60, name: "Research Lab"},
  40: {x: 1260, y: 390, w: 80, h: 60, name: "Innovation Hub"},
  41: {x: 1220, y: 330, w: 70, h: 60, name: "Incubator"},
  42: {x: 1340, y: 330, w: 70, h: 60, name: "Tech Park"},
  43: {x: 1140, y: 350, w: 60, h: 50, name: "Data Center"},
  44: {x: 1230, y: 140, w: 70, h: 60, name: "Conference Center"},
  45: {x: 1200, y: 300, w: 60, h: 50, name: "Guest House"},
  46: {x: 1340, y: 230, w: 80, h: 60, name: "Stadium"}
};

// 2. DEFINE THE WALKABLE PATH GRAPH (Nodes and Edges)
// These coordinates define the intersections of the white paths.
const nodes = {
  a:[610,425], b:[610,470], c:[610,540], d:[610,610], e:[610,680],
  f:[610,750], g:[700,750], h:[780,750], i:[870,750], j:[970,750],
  k:[1010,680], l:[1010,610], m:[1010,530], n:[1010,460], o:[1010,390],
  p:[950,340], q:[870,340], r:[780,340], s:[700,340], t:[610,340],
  u:[610,270], v:[610,190], w:[610,145], x:[700,145], y:[780,145],
  z:[870,145], aa:[970,145], ab:[1010,220], ac:[1010,300],
  ad:[1100,450], ae:[1170,450], af:[1240,450], ag:[1300,450],
  ah:[1300,400], ai:[1240,350], aj:[1170,350], ak:[1100,350],
  al:[1100,300], am:[1170,300], an:[1240,300], ao:[1300,300],
  ap:[1300,250], aq:[1360,250], ar:[1300,200], as:[1300,150],
  at:[1240,150], au:[1170,150],
  av:[500,610], aw:[450,650], ax:[400,700], ay:[350,760], az:[350,820],
  ba:[450,820], bb:[520,820], bc:[610,820],
  bd:[450,550], be:[390,550], bf:[320,550], bg:[250,550],
  bh:[250,450], bi:[250,350], bj:[250,250], bk:[360,250], bl:[450,250],
  bm:[450,180], bn:[500,145]
};

const edges = [
  ['a','b'],['b','c'],['c','d'],['d','e'],['e','f'],['f','g'],['g','h'],['h','i'],['i','j'],
  ['j','k'],['k','l'],['l','m'],['m','n'],['n','o'],['o','p'],['p','q'],['q','r'],['r','s'],['s','t'],
  ['t','u'],['u','v'],['v','w'],['w','x'],['x','y'],['y','z'],['z','aa'],['aa','ab'],['ab','ac'],['ac','o'],
  ['n','ad'],['ad','ae'],['ae','af'],['af','ag'],['ag','ah'],['ah','ai'],['ai','aj'],['aj','ak'],
  ['ak','al'],['al','am'],['am','an'],['an','ao'],['ao','ap'],['ap','aq'],['ao','ar'],['ar','as'],['as','at'],['at','au'],
  ['av','a'],['av','aw'],['aw','ax'],['ax','ay'],['ay','az'],['az','ba'],['ba','bb'],['bb','bc'],['bc','f'],
  ['av','bd'],['bd','be'],['be','bf'],['bf','bg'],['bg','bh'],['bh','bi'],['bi','bj'],['bj','bk'],['bk','bl'],
  ['bl','bm'],['bm','bn'],['bn','w'],['bl','t']
];

function dist(p,q){return Math.hypot(p[0]-q[0],p[1]-q[1])}
const graph = {};
Object.keys(nodes).forEach(k=>graph[k]=[]);
edges.forEach(([u,v])=>{
  const w=dist(nodes[u],nodes[v]);
  graph[u].push([v,w]); graph[v].push([u,w]);
});

// 3. CONNECT BUILDINGS TO THE NEAREST PATH NODE
const anchors = {};
for(const [id, data] of Object.entries(buildingData)){
  // Calculate center of the building
  const cx = data.x + data.w/2;
  const cy = data.y + data.h/2;
  let best=null, bd=Infinity;
  for(const [n,q] of Object.entries(nodes)){
    const d=dist([cx,cy],q);
    if(d<bd){bd=d;best=n}
  }
  anchors[id]=best;
}

// 4. DIJKSTRA'S ALGORITHM
function dijkstra(start,end){
  const D={}, prev={}, used={};
  Object.keys(nodes).forEach(k=>D[k]=Infinity);
  D[start]=0;
  while(true){
    let u=null, best=Infinity;
    for(const k of Object.keys(nodes)){
      if(!used[k] && D[k]<best){best=D[k];u=k}
    }
    if(u===null || u===end) break;
    used[u]=true;
    for(const [v,w] of graph[u]){
      const nd=D[u]+w;
      if(nd<D[v]){D[v]=nd;prev[v]=u}
    }
  }
  if(D[end]===Infinity)return [];
  const path=[]; let u=end;
  while(u!==undefined){path.unshift(u); if(u===start)break; u=prev[u]}
  return path;
}

// 5. RENDER THE MAP (Buildings and Roads)
const mapSvg = document.getElementById('map');
const buildingLayer = document.getElementById('buildingLayer');
const roadLayer = document.getElementById('roadLayer');
const markerLayer = document.getElementById('markerLayer');
const routeLayer = document.getElementById('routeLayer');
const info = document.getElementById('info');
const startSel = document.getElementById('start');
const endSel = document.getElementById('end');
const status = document.getElementById('status');

function svgEl(name,attrs){
  const e=document.createElementNS("http://www.w3.org/2000/svg",name);
  for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);
  return e;
}

// Draw the white roads first (so they are behind buildings)
edges.forEach(([u,v])=>{
    const p1 = nodes[u];
    const p2 = nodes[v];
    const line = svgEl('line', {x1:p1[0], y1:p1[1], x2:p2[0], y2:p2[1]});
    roadLayer.appendChild(line);
});

// Draw the buildings
for(const [id, data] of Object.entries(buildingData)){
    const g = svgEl('g', {class:'marker', transform:`translate(${data.x + data.w/2}, ${data.y + data.h/2})`});
    
    // Building shape
    const rect = svgEl('rect', {
        x: -data.w/2, 
        y: -data.h/2, 
        width: data.w, 
        height: data.h, 
        rx: 5,
        fill: '#b0b5b9', 
        stroke: '#ffffff', 
        'stroke-width': 2,
        cursor: 'pointer'
    });
    
    // Building number label
    const text = svgEl('text', {x:0, y:1});
    text.textContent = id;
    
    g.append(rect, text);
    
    // Make the whole group clickable
    g.addEventListener('click', ()=>{
        startSel.value = id;
        updateHighlight();
        info.innerHTML = `<strong>Building ${id}: ${data.name}</strong><br>Selected as the starting point.<br><br>Choose a destination and click <b>Find Route</b>.`;
        info.style.display = 'block';
    });

    buildingLayer.appendChild(g);
}

// 6. UI LOGIC AND ROUTING
for(let i=1; i<=46; i++){
  const a=document.createElement('option'); a.value=i; a.textContent=`Building ${i} (${buildingData[i].name})`; startSel.appendChild(a);
  const b=document.createElement('option'); b.value=i; b.textContent=`Building ${i} (${buildingData[i].name})`; endSel.appendChild(b);
}
startSel.value="1"; endSel.value="28";

// Update the visual state of markers (start/end/selected)
function updateHighlight(){
    document.querySelectorAll('.marker').forEach((g, index)=>{
        const id = String(index + 1);
        g.classList.remove('start', 'end', 'selected');
        
        // Change circle color based on state
        const circle = g.querySelector('circle');
        if(id === startSel.value) {
            g.classList.add('start');
            circle.setAttribute('fill', '#16823c'); // Green
        } else if(id === endSel.value) {
            g.classList.add('end');
            circle.setAttribute('fill', '#d33'); // Red
        } else {
            circle.setAttribute('fill', '#111'); // Default black
        }
    });
}

function drawRoute(){
  routeLayer.innerHTML='';
  const s=startSel.value, e=endSel.value;
  if(s===e){status.textContent='Start and destination cannot be the same.';return}
  
  const path=dijkstra(anchors[s],anchors[e]);
  if(!path.length){status.textContent='No route found.';return}
  
  // Get center points of start and end buildings
  const startCenter = [buildingData[s].x + buildingData[s].w/2, buildingData[s].y + buildingData[s].h/2];
  const endCenter = [buildingData[e].x + buildingData[e].w/2, buildingData[e].y + buildingData[e].h/2];
  
  // Construct the full path: Start Building -> Path Nodes -> End Building
  const pts=[startCenter, ...path.map(n=>nodes[n]), endCenter];
  const d=pts.map((p,i)=>(i?'L':'M')+` ${p[0]} ${p[1]}`).join(' ');
  
  // Draw the blue route line
  routeLayer.appendChild(svgEl('path',{d,class:'route'}));
  routeLayer.appendChild(svgEl('path',{d,class:'route-inner'}));
  
  // Calculate distance (approximate)
  const meters=Math.round(path.reduce((sum,n,i)=>i?sum+dist(nodes[path[i-1]],nodes[n]):0,0)*0.55);
  
  status.textContent=`Route shown: Building ${s} → Building ${e} • about ${meters} m`;
  info.innerHTML=`<strong>Walking Route</strong><br>From Building ${s} (${buildingData[s].name}) to Building ${e} (${buildingData[e].name}).<br><br>The blue line follows the mapped walkways.`;
  info.style.display='block';
  updateHighlight();
}

document.getElementById('find').onclick = drawRoute;
document.getElementById('clear').onclick = ()=>{
  routeLayer.innerHTML='';
  info.style.display='none';
  status.textContent='Choose a start and destination.';
  updateHighlight();
};
startSel.onchange = updateHighlight;
endSel.onchange = updateHighlight;

// Initial render
updateHighlight();
</script>
</body>
</html>
